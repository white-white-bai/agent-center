name: agent-center

services:
  mysql:
    image: mysql:8.0
    container_name: agent-center-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: agent_center
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent_pass
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uagent", "-pagent_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: agent-center-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: agent-center-app
    environment:
      AC_DATABASE_URL: mysql+aiomysql://agent:agent_pass@mysql:3306/agent_center?charset=utf8mb4
      AC_AUTO_CREATE_TABLES: "true"
      AC_REDIS_URL: redis://redis:6379/0
      AC_MILVUS_URI: ${AC_MILVUS_URI:-/data/milvus.db}
      AC_MILVUS_COLLECTION: agent_center_knowledge
      AC_EMBEDDING_DIM: "1024"
      AC_MODEL_PROVIDER: ${AC_MODEL_PROVIDER:-openai}
      AC_LLM_BASE_URL: ${AC_LLM_BASE_URL:-https://api.commandcode.ai/provider/v1}
      AC_LLM_API_KEY: ${AC_LLM_API_KEY:-}
      AC_LLM_MODEL: ${AC_LLM_MODEL:-deepseek/deepseek-v4.1-flash}
      AC_LLM_FALLBACK_MODEL: ${AC_LLM_FALLBACK_MODEL:-deepseek/deepseek-v4-flash}
      AC_EMBEDDING_MODEL: ${AC_EMBEDDING_MODEL:-}
      AC_CREDENTIAL_KEY: ${AC_CREDENTIAL_KEY:-dev-local-credential-key}
      AC_SENSITIVE_WORDS: ${AC_SENSITIVE_WORDS:-}
      AC_MODERATION_URL: ${AC_MODERATION_URL:-}
      AC_MODERATION_API_KEY: ${AC_MODERATION_API_KEY:-}
      AC_MODERATION_TIMEOUT_MS: ${AC_MODERATION_TIMEOUT_MS:-2000}
      AC_DIFY_BASE_URL: ${AC_DIFY_BASE_URL:-}
      AC_DIFY_API_KEY: ${AC_DIFY_API_KEY:-}
      AC_DIFY_TIMEOUT_MS: ${AC_DIFY_TIMEOUT_MS:-15000}
      AC_DIFY_PAGE_SIZE: ${AC_DIFY_PAGE_SIZE:-100}
      AC_DIFY_CHATFLOW_API_KEY: ${AC_DIFY_CHATFLOW_API_KEY:-}
      AC_DIFY_CHATFLOW_TIMEOUT_MS: ${AC_DIFY_CHATFLOW_TIMEOUT_MS:-30000}
      AC_OTEL_ENABLED: ${AC_OTEL_ENABLED:-false}
      AC_OTEL_ENDPOINT: ${AC_OTEL_ENDPOINT:-}
      AC_OTEL_SERVICE_NAME: ${AC_OTEL_SERVICE_NAME:-agent-center}
      AC_OTEL_SAMPLE_RATIO: ${AC_OTEL_SAMPLE_RATIO:-1.0}
      AC_SSE_HEARTBEAT_SECONDS: "15"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      TZ: Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      - milvus_lite_data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Milvus 整套服务。默认不启动，网络可访问镜像仓库时使用：
  #   AC_MILVUS_URI=http://milvus:19530 docker compose --profile milvus up -d
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: agent-center-etcd
    profiles: ["milvus"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: agent-center-minio
    profiles: ["milvus"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: agent-center-milvus
    profiles: ["milvus"]
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  mysql_data:
  redis_data:
  milvus_lite_data:
  etcd_data:
  minio_data:
  milvus_data:
