services:
  app:
    environment:
      AC_OTEL_ENABLED: "true"
      AC_OTEL_ENDPOINT: http://tempo:4318/v1/traces
      AC_OTEL_SAMPLE_RATIO: ${AC_OTEL_SAMPLE_RATIO:-1.0}
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.5.0
    container_name: agent-center-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4318:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: agent-center-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --enable-feature=exemplar-storage
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    container_name: agent-center-gateway
    profiles: ["gateway"]
    volumes:
      - ./deploy/gateway/nginx-sse.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      app:
        condition: service_started

  grafana:
    image: grafana/grafana:11.1.0
    container_name: agent-center-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  tempo_data:
  prometheus_data:
  grafana_data:
