[project]
name = "agent-center"
version = "0.1.0"
description = "智能体中台（Agent Center）执行面与管理面服务"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "langgraph>=1.0",
]

[project.optional-dependencies]
mysql = ["aiomysql>=0.2"]
redis = ["redis>=5.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "alembic>=1.13",
    "pymysql>=1.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
